; GoatDriver - Goat Simulator: PAYDAY style driving. Key names are System.Windows.Forms.Keys names.

[General]
Enabled=true
; NumPad keys move/rotate the goat on the wheel live while driving. Set false when you are happy.
TuneMode=true
; how close to a vehicle you must stand when pressing the enter key (metres)
EntryRange=4.0
; throw the current driver out when you take the seat
StealOccupiedSeat=true
RollDownWindow=true
; 0 = front left. Right-hand-drive vehicle: 1
WindowIndex=0
RollUpOnExit=true
; thrown out of the attachment into a real ragdoll on big crashes (then put back in the seat)
CrashRagdoll=false
; m/s lost in one frame that counts as a crash
CrashSpeedDrop=9.0
; bone the goat is attached to; falls back to FallbackBone, then the chassis
WheelBone=steeringwheel
FallbackBone=seat_dside_f
; only these models use the goat driving (humans drive normally)
GoatModels=gs_goat,gs_gloria,gs_devil,gs_feather,gs_tall,gs_classy,gs_g2,gs_space,gs_goast,gs_sperm,gs_flamingoat,gs_camel,gs_dolphwheel,gs_handsome,gs_panzer,a_c_deer
; human driving clips to stop each frame, as dict|clip pairs separated by ;
BlockedAnims=move_driving|;veh@std@ds@base|idle;veh@driveby@driver|

[Offset]
; position in the steeringwheel bone's local axes (metres), rotation in degrees.
; Tune in game with the NumPad keys (see the top of GoatDriver.cs), press NumPad0, copy the values from GoatDriver.log here.
PosX=0.0
PosY=-0.35
PosZ=-0.45
RotX=0.0
RotY=0.0
RotZ=0.0
; resting forward lean so the front legs reach the wheel
BasePitch=25.0
; extra sideways shift toward the window at full lean-out
LeanShiftX=-0.18

[Physics]
Stiffness=38.0
Damping=5.5
; degrees of roll per m/s^2 of sideways acceleration
LateralGain=3.2
; degrees of pitch per m/s^2 of forward/back acceleration
LongitudinalGain=2.4
; constant lean toward the window, reached at LeanFullSpeed (m/s)
WindowLeanDegrees=32.0
LeanFullSpeed=22.0
; random sway in degrees at speed
Wobble=6.0
; flip to -1 / 1 if the goat leans the wrong way
RollSign=-1.0
PitchSign=1.0
; spring velocity added on a crash (degrees/s)
CrashKick=70.0
