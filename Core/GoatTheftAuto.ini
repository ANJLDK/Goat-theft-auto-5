; Goat Theft Auto 5 - settings. Key names are System.Windows.Forms.Keys names.

[Keys]
; Defaults follow the original Goat Simulator PC controls. Left mouse = headbutt and right mouse (in the air) = spin trick
; are built in (GoatSimControls below). H and J stay as extra headbutt / kick keys.
ToggleGoatMode=F10
NextGoat=Tab
PreviousGoat=OemOpenBrackets
NextAccessory=OemPeriod
PreviousAccessory=Oemcomma
Headbutt=H
Kick=J
Lick=E
Special=R
Baa=D1
AccessoryAction=G
Ragdoll=Q
MusicToggle=M
MusicNext=N
RadioToggle=F9

[Options]
; original Goat Simulator controls: LMB headbutt, RMB air trick, E lick, Q ragdoll, R special / interact, 1 baa, Tab next goat.
; GTA's own use of those buttons (attack, aim, cover, pickup, reload, weapon wheel, enter vehicle) is disabled while you are a goat.
GoatSimControls=true
; original damage points -> GTA health (400 damage * 0.25 = 100 health)
DamageScale=0.25
; knock-back multiplier
ForceScale=1.0
; goats cannot die, like in Goat Simulator
GodMode=true
; ped model used when your converted goat model is not installed yet
FallbackModel=a_c_deer

[Radio]
; "Chilled Goat": one song on loop, tuned with the RadioToggle key (F9) - works even when you are not a goat.
; GTA's radio wheel cannot be extended by a script, so this is a station you tune with a key.
Enabled=true
StationName=Chilled Goat
Track=1x02_Goat_Chill
; Vehicle = only plays while you are in a vehicle, pauses when you get out (default)
; Always  = plays all the time once tuned in (on foot, in cars, everywhere)
Mode=Vehicle
; Every time you get into a vehicle the dial goes to Chilled Goat (turn the radio wheel to another
; station to leave it, press F9 to switch it off completely).
DefaultStation=true
; start already tuned in?
StartTunedIn=true
; 0-1000
Volume=600

[Music]
; Optional goat-mode soundtrack (off by default - the Chilled Goat radio above replaces it).
; Plays the tracks in this folder (mp3/wav/wma) in order while you are a goat. M = on/off, N = next song.
; The soundtrack is NOT included in the mod. Point this at your own copy.
Enabled=false
; Songs to play, in order, as file names (extension optional). Leave empty to play the whole folder.
; One song loops.
Playlist=1x02_Goat_Chill
Folder=E:\SteamLibrary\steamapps\music\Goat Simulator Original Soundtrack\01 - Vanilla
; 0-1000
Volume=600

; Any field of a goat can be overridden. Section name = Goat.<id>
; Ids: goat angel devil feather feather_angel feather_devil tall tall_angel tall_devil
;      classy g2 space goast sperm shopping flamingoat camel dolphwheel handsome panzer
; Speeds are metres per second. JumpZ is in Unreal units/s (same number as the game's scripts).
