; GoatStyle - trick score, HUD, mutators, bonus screen, achievements, photo mode.
; Key names are System.Windows.Forms.Keys names.

[General]
Enabled=true
; tricks and the score HUD only run while your ped model is one of GoatModels (menu, photo mode and achievements work always)
OnlyAsGoat=true
ShowHud=true
; time (seconds) you have to chain the next trick before the combo banks
ComboSeconds=4.0
; highest multiplier
ComboMax=10
; how long the WASTED / BUSTED bonus screen stays up
BonusScreenSeconds=9
GoatModels=gs_goat,gs_gloria,gs_devil,gs_feather,gs_tall,gs_classy,gs_g2,gs_space,gs_goast,gs_sperm,gs_flamingoat,gs_camel,gs_dolphwheel,gs_handsome,gs_panzer,a_c_deer

[Keys]
; hold for slow motion, like the original game
SlowMotion=F
Mutators=F11
Achievements=F8
PhotoMode=F7
; same keys as GoatTheftAuto.ini, used to tell headbutts and kicks apart
Headbutt=H
Kick=J
Lick=E

[Photo]
; stop the world while the photo camera is out
FreezeTime=true
CameraSpeed=6.0
MouseSensitivity=4.0
; hat props (any prop model name). Models the game does not have are skipped with a message.
Hats=prop_roadcone02a,prop_tool_hardhat,prop_ld_hat_01,prop_beachball_02
; timecycle modifier names; NONE = no filter
Filters=NONE,CAMERA_BW,NG_filmic02,NG_filmic13,Bank_HLWD,REDMIST_blend,scanline_cam_cheap,drug_flying_base
; hat position/rotation relative to the head bone (metres / degrees). Raise HatZ if the hat sits inside the head.
HatX=0.0
HatY=0.05
HatZ=0.12
HatRotX=0
HatRotY=0
HatRotZ=0
